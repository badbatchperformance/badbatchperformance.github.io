<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>TV Setup</title>
<script src="../demos.js"></script>
<style>
  body { margin: 0; background: #0b0b0b; color: #f5f5f5; font-family: system-ui, sans-serif; display: flex; min-height: 100vh; align-items: center; justify-content: center; }
  .box { text-align: center; max-width: 900px; padding: 4vh 4vw; }
  img { height: 9vh; }
  h1 { font-size: 5vh; margin: 3vh 0 1vh; text-transform: uppercase; letter-spacing: .03em; }
  p { font-size: 2.6vh; color: #a3a3a3; margin: 1vh 0 3vh; }
  input { font-size: 5vh; width: 70%; padding: 1.5vh 2vh; text-align: center; border-radius: 1.2vh; border: .4vh solid #ed1c24; background: #161616; color: #fff; letter-spacing: .1em; }
  button { font-size: 3vh; margin-top: 3vh; padding: 1.5vh 4vh; border-radius: 1.2vh; border: 0; background: #ed1c24; color: #fff; font-weight: 800; }
  .msg { color: #ed1c24; font-size: 2.6vh; min-height: 3vh; margin-top: 2vh; }
  a { color: #a3a3a3; font-size: 2.2vh; display: inline-block; margin-top: 4vh; }
</style>
</head>
<body>
<div class="box">
  <img src="../assets/logo.svg" alt="Bad Batch Performance">
  <h1 id="title">TV setup</h1>
  <p>Enter the gym code once. This TV will remember it.</p>
  <form id="f"><input id="code" placeholder="xxxx-xxxx-xxxx" autocomplete="off" autocapitalize="off" autofocus><br><button>Start the WOD board</button></form>
  <div class="msg" id="msg"></div>
  <a id="skip" href="#">Skip: run without demo videos</a>
</div>
<script>
(async () => {
  const track = location.pathname.includes('/tv2') ? '2' : '1';
  document.getElementById('title').textContent = `TV ${track} setup · ${track === '1' ? 'Build' : 'Athlete'}`;
  const board = k => `../?wall=both&track=${track}${k ? '#k=' + k : ''}`;
  document.getElementById('skip').href = board('');
  let saved = null; try { saved = localStorage.getItem('bbDemoKey'); } catch (e) {}
  if (saved && await BBDemos.load(saved)) return location.replace(board(saved));
  const b64url = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  document.getElementById('f').onsubmit = async e => {
    e.preventDefault();
    const raw = document.getElementById('code').value.toLowerCase().replace(/[^a-z0-9]/g, '');
    const code = raw.match(/.{1,4}/g)?.join('-') || '';
    const hash = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('bb30:' + code));
    const key = b64url(hash.slice(0, 16));
    if (await BBDemos.load(key)) { try { localStorage.setItem('bbDemoKey', key); } catch (e) {} location.replace(board(key)); }
    else document.getElementById('msg').textContent = 'That code didn’t work. Check it and try again.';
  };
})();
</script>
</body>
</html>
